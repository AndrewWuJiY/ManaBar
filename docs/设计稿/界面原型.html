<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ManaBar 样式稿</title>
<style>
  :root {
    color-scheme: light;
    --window: #f5f5f7;
    --card: #ffffff;
    --popover: rgba(255,255,255,.9);
    --text: #1d1d1f;
    --secondary: rgba(60,60,67,.62);
    --tertiary: rgba(60,60,67,.38);
    --line: rgba(0,0,0,.1);
    --fill: rgba(120,120,128,.12);
    --track: rgba(120,120,128,.16);
    --blue: #007aff;
    --sidebar: rgba(0,0,0,.035);
    --hover: rgba(0,0,0,.05);
    --shadow: 0 18px 50px rgba(0,0,0,.18);
    --codex: #718DFF;
    --claude: #D97757;
    --ink: #1c1c1e;
    --up: #248a3d;
    --down: #d70015;
    --hud: rgba(255,255,255,.62);
    --widget: rgba(255,255,255,.78);
    --menu: rgba(255,255,255,.55);
    --menu-line: rgba(0,0,0,.08);
    --seg: #ffffff;
    --desktop: radial-gradient(1100px 520px at 8% -10%, #f8f5ef 0%, transparent 55%),
               linear-gradient(165deg, #d7e4f6 0%, #e6e3f3 40%, #f3ece3 100%);
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --window: #1e1e20;
    --card: #2c2c2e;
    --popover: rgba(44,44,46,.9);
    --text: #f5f5f7;
    --secondary: rgba(235,235,245,.6);
    --tertiary: rgba(235,235,245,.35);
    --line: rgba(255,255,255,.1);
    --fill: rgba(120,120,128,.28);
    --track: rgba(255,255,255,.12);
    --blue: #0a84ff;
    --sidebar: rgba(255,255,255,.03);
    --hover: rgba(255,255,255,.06);
    --shadow: 0 18px 50px rgba(0,0,0,.45);
    --codex: #8FA6FF;
    --claude: #E68A6E;
    --ink: #E6E6EA;
    --up: #30d158;
    --down: #ff453a;
    --hud: rgba(28,28,30,.66);
    --widget: rgba(36,36,38,.78);
    --menu: rgba(22,22,24,.55);
    --menu-line: rgba(255,255,255,.08);
    --seg: #636366;
    --desktop: radial-gradient(900px 480px at 80% 0%, #2c364c 0%, transparent 55%),
               linear-gradient(165deg, #171a22 0%, #221f29 52%, #1c1c1e 100%);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
    font-size: 13px;
    color: var(--text);
    background: #0e0e10;
    display: flex;
    flex-direction: column;
    min-width: 980px;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
  [hidden] { display: none !important; }
  .desktop { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--desktop); }
  .menubar {
    height: 28px; flex: none;
    display: flex; align-items: center; gap: 16px;
    padding: 0 12px;
    background: var(--menu);
    backdrop-filter: blur(22px) saturate(1.4);
    -webkit-backdrop-filter: blur(22px) saturate(1.4);
    border-bottom: 0.5px solid var(--menu-line);
    font-weight: 500;
    user-select: none;
  }
  .menubar .app { font-weight: 700; }
  .menubar .menus { display: flex; gap: 16px; color: var(--secondary); font-weight: 500; }
  .menubar .right { margin-left: auto; display: flex; align-items: center; gap: 14px; }
  .menubar .ghost { color: var(--secondary); font-weight: 500; font-variant-numeric: tabular-nums; }
  #status-item {
    display: flex; align-items: center; gap: 8px;
    height: 22px; padding: 0 7px; border-radius: 5px; color: var(--text);
  }
  #status-item:hover, #status-item.open { background: var(--fill); }
  .mb-seg { display: flex; align-items: center; gap: 4px; }
  .mb-segs { display: flex; align-items: center; gap: 9px; }
  .mb-segs.compact { gap: 6px; }
  .logo { width: 14px; height: 14px; display: block; }
  .mb-seg .logo { width: 15px; height: 15px; }
  .mb-seg .logo.cursor { width: 12px; height: 12px; }
  .mb-num { font-size: 13px; font-weight: 560; letter-spacing: -0.02em; }
  .stage { flex: 1; min-height: 0; position: relative; }
  .window {
    position: absolute; top: 22px; left: 22px; bottom: 22px;
    width: min(1040px, calc(100% - 300px));
    background: var(--window);
    border-radius: 12px;
    box-shadow: var(--shadow), 0 0 0 0.5px rgba(0,0,0,.12);
    display: flex; flex-direction: column;
    overflow: hidden;
    min-width: 680px;
  }
  [data-theme="dark"] .window { box-shadow: var(--shadow), 0 0 0 0.5px rgba(255,255,255,.12); }
  .titlebar {
    height: 52px; flex: none; position: relative;
    display: flex; align-items: center;
    border-bottom: 0.5px solid var(--line);
  }
  .lights { display: flex; gap: 8px; margin-left: 20px; }
  .light {
    width: 12px; height: 12px; border-radius: 50%;
    display: grid; place-items: center;
    font-size: 9px; line-height: 1; color: rgba(0,0,0,.55); font-weight: 700;
  }
  .light span { opacity: 0; }
  .lights:hover .light span { opacity: 1; }
  .light.r { background: #ff5f57; }
  .light.y { background: #febc2e; }
  .light.g { background: #28c840; }
  .title-seg {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    display: flex; padding: 2px; border-radius: 8px; background: var(--fill);
  }
  .title-seg button, .seg button {
    border: 0; background: transparent; height: 24px; padding: 0 12px;
    border-radius: 6px; font-size: 12px; font-weight: 560; color: var(--text);
  }
  .title-seg button.on, .seg button.on {
    background: var(--seg);
    box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 0 0 0.5px rgba(0,0,0,.05);
  }
  .body { flex: 1; min-height: 0; display: flex; }
  .sidebar {
    width: 200px; flex: none;
    background: var(--sidebar);
    border-right: 0.5px solid var(--line);
    padding: 10px 0 16px;
    overflow: auto;
  }
  .side-label {
    margin: 8px 18px 4px;
    font-size: 11px; font-weight: 600; color: var(--tertiary);
  }
  .side-item {
    width: calc(100% - 16px);
    margin: 1px 8px; height: 28px; padding: 0 8px;
    border: 0; border-radius: 6px; background: transparent;
    display: flex; align-items: center; gap: 8px;
    text-align: left; color: var(--text); font-size: 13px;
  }
  .side-item:hover:not(.on) { background: var(--hover); }
  .side-item.on { background: var(--blue); color: white; }
  .side-item .sn { min-width: 0; }
  .side-item .tail { margin-left: auto; color: var(--secondary); font-size: 12px; }
  .side-item.on .tail, .side-item.on .sico { color: rgba(255,255,255,.88); }
  .dot { width: 8px; height: 8px; border-radius: 2px; flex: none; }
  .dot.codex { background: var(--codex); }
  .dot.claude { background: var(--claude); }
  .dot.cursor { background: var(--ink); }
  .side-item.on .dot { background: white; }
  .sico { width: 15px; height: 15px; color: var(--secondary); flex: none; }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .toolbar {
    height: 42px; flex: none;
    display: flex; align-items: center; gap: 8px;
    padding: 0 16px;
    border-bottom: 0.5px solid var(--line);
  }
  .seg { display: inline-flex; padding: 2px; border-radius: 8px; background: var(--fill); }
  .spacer { flex: 1; }
  .rangewrap { position: relative; }
  .menu-btn, .export-btn {
    height: 26px; border: 0; border-radius: 6px; background: var(--fill);
    display: inline-flex; align-items: center; gap: 4px; padding: 0 8px 0 10px;
    font-size: 12px; font-weight: 560;
  }
  .export-btn { padding: 0 10px; }
  .export-btn:disabled { opacity: .4; cursor: default; }
  .uico { width: 14px; height: 14px; }
  .range-pop {
    position: absolute; top: 30px; right: 0; width: 148px; z-index: 6;
    padding: 4px; border-radius: 10px;
    background: var(--popover);
    backdrop-filter: blur(20px);
    box-shadow: 0 12px 32px rgba(0,0,0,.18), 0 0 0 0.5px rgba(0,0,0,.08);
  }
  .range-pop button {
    display: flex; width: 100%; height: 26px; align-items: center;
    border: 0; background: transparent; border-radius: 6px;
    padding: 0 8px; font-size: 13px; text-align: left;
  }
  .range-pop button:hover, .range-pop button.on { background: var(--blue); color: white; }
  .custom-row {
    display: flex; gap: 12px; align-items: center;
    padding: 8px 16px; border-bottom: 0.5px solid var(--line);
    font-size: 12px; color: var(--secondary);
  }
  .custom-row input { height: 22px; border-radius: 6px; border: 0.5px solid var(--line); background: var(--card); padding: 0 6px; }
  .content { flex: 1; min-height: 0; overflow: auto; padding: 18px 20px 28px; }
  .content::-webkit-scrollbar { width: 10px; }
  .content::-webkit-scrollbar-thumb { background: rgba(120,120,128,.35); border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }
  .section-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 0 2px 8px; }
  .section-h h2 { margin: 0; font-size: 15px; letter-spacing: -0.02em; }
  .section-h p, .note { margin: 3px 0 0; font-size: 12px; color: var(--secondary); }
  .qcards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .qcards.single { grid-template-columns: minmax(220px, 380px); }
  .qcard {
    background: var(--card); border: 0.5px solid var(--line); border-radius: 12px;
    padding: 14px; text-align: left; width: 100%;
  }
  .qcard:hover { border-color: rgba(0,0,0,.18); }
  [data-theme="dark"] .qcard:hover { border-color: rgba(255,255,255,.2); }
  .qtop { display: flex; gap: 10px; align-items: center; }
  .qmeta { min-width: 0; flex: 1; }
  .qname { font-weight: 600; letter-spacing: -0.01em; }
  .qplan { font-size: 11px; color: var(--secondary); margin-top: 1px; }
  .qbody { margin-top: 12px; }
  .qwin { font-size: 12px; color: var(--secondary); }
  .qreset { margin-top: 2px; font-size: 12px; }
  .qweek { display: flex; justify-content: space-between; margin-top: 12px; font-size: 12px; color: var(--secondary); }
  .qweek b { color: var(--text); font-weight: 600; }
  .track { height: 5px; border-radius: 3px; background: var(--track); overflow: hidden; margin-top: 6px; }
  .track > i { display: block; height: 100%; border-radius: 3px; }
  .ring { position: relative; flex: none; }
  .ring svg { width: 100%; height: 100%; display: block; }
  .ring b {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-size: 13px; letter-spacing: -0.03em;
  }
  .tile {
    width: 22px; height: 22px; border-radius: 6px;
    display: grid; place-items: center; color: white; flex: none;
  }
  .tile .logo { width: 13px; height: 13px; }
  .tile.cursor .logo { width: 11px; height: 11px; }
  .tile.sm { width: 18px; height: 18px; border-radius: 5px; }
  .tile.sm .logo { width: 11px; height: 11px; }
  .tile.sm.cursor .logo { width: 10px; height: 10px; }
  .tile.codex { background: var(--codex); }
  .tile.claude { background: var(--claude); }
  .tile.cursor { background: var(--ink); color: #fff; box-shadow: inset 0 0 0 0.5px rgba(0,0,0,.25); }
  [data-theme="dark"] .tile.cursor { color: #1c1c1e; box-shadow: inset 0 0 0 0.5px rgba(255,255,255,.35); }
  .gap { height: 22px; }
  .metrics {
    display: grid; grid-template-columns: repeat(4, 1fr);
    background: var(--card); border: 0.5px solid var(--line); border-radius: 12px; overflow: hidden;
  }
  .metrics.two { grid-template-columns: 1fr 1fr; }
  .metrics > div { padding: 12px 14px 13px; border-right: 0.5px solid var(--line); }
  .metrics > div:last-child { border-right: 0; }
  .mk { font-size: 11px; color: var(--secondary); }
  .mv { margin-top: 2px; font-size: 22px; font-weight: 600; letter-spacing: -0.03em; }
  .md { min-height: 16px; margin-top: 2px; font-size: 11px; font-weight: 650; }
  .up { color: var(--up); }
  .down { color: var(--down); }
  .card {
    background: var(--card); border: 0.5px solid var(--line); border-radius: 12px;
    padding: 14px 16px 8px;
  }
  .card h3 { margin: 0; font-size: 13px; letter-spacing: -0.01em; }
  .card .sub { margin: 3px 0 12px; color: var(--secondary); font-size: 12px; }
  .sharebar { display: flex; height: 10px; gap: 3px; }
  .sharebar i { display: block; border-radius: 5px; min-width: 6px; }
  .legend { display: flex; gap: 16px; margin: 10px 0 4px; font-size: 12px; color: var(--secondary); }
  .legend b { color: var(--text); font-weight: 600; }
  .legend .dot { display: inline-block; margin-right: 6px; vertical-align: 0; }
  svg.chart { width: 100%; height: auto; display: block; margin-top: 6px; }
  .mlist { margin-top: 8px; border-top: 0.5px solid var(--line); }
  .mrow { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-top: 0.5px solid var(--line); }
  .mrow:first-child { border-top: 0; }
  .mrow .mn { font-weight: 600; }
  .mrow .ms { font-size: 11px; color: var(--tertiary); margin-top: 2px; }
  .mrow .mc { margin-left: auto; font-weight: 600; font-size: 14px; }
  .empty {
    min-height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: 4px; color: var(--secondary); padding: 24px 12px;
  }
  .empty b { color: var(--text); font-size: 13px; }
  .empty p { margin: 0; font-size: 12px; max-width: 320px; line-height: 1.45; }
  .tblock { margin-bottom: 12px; }
  .thead { display: flex; align-items: flex-start; gap: 12px; }
  .thead .who { font-weight: 650; }
  .badge {
    display: inline-block; margin-left: 6px; font-size: 10px; font-weight: 650;
    color: var(--secondary); background: var(--fill); border-radius: 20px; padding: 1px 6px;
    vertical-align: 1px;
  }
  .kpis { margin-left: auto; display: flex; gap: 18px; }
  .kpis div { text-align: right; }
  .kpis span { display: block; font-size: 10px; color: var(--tertiary); }
  .kpis b { font-size: 13px; font-weight: 650; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 7px 8px; text-align: left; white-space: nowrap; }
  th {
    font-size: 11px; font-weight: 650; color: var(--secondary);
    border: 0; background: transparent; cursor: pointer;
  }
  th.num, td.num { text-align: right; }
  td { font-size: 12px; border-top: 0.5px solid var(--line); }
  tbody tr:hover td { background: var(--hover); }
  tr.foot td { font-weight: 650; background: var(--fill); }
  .svc { display: inline-flex; align-items: center; gap: 6px; }
  .more {
    margin: 4px 0 8px; border: 0; background: transparent; color: var(--blue);
    font-size: 12px; font-weight: 560; padding: 0;
  }
  .form { max-width: 640px; }
  .group { margin-bottom: 22px; }
  .group h3 { margin: 0 4px 4px; font-size: 13px; }
  .group .desc { margin: 0 4px 8px; font-size: 12px; color: var(--secondary); line-height: 1.4; }
  .gbody { background: var(--card); border: 0.5px solid var(--line); border-radius: 10px; overflow: hidden; }
  .grow { display: flex; gap: 12px; align-items: center; padding: 10px 14px; border-top: 0.5px solid var(--line); }
  .grow:first-child { border-top: 0; }
  .gl { flex: 1; min-width: 0; }
  .gt { font-size: 13px; }
  .gd { margin-top: 2px; font-size: 11px; color: var(--tertiary); line-height: 1.35; }
  .switch {
    width: 32px; height: 20px; border-radius: 11px; border: 0; padding: 0;
    background: rgba(120,120,128,.32); position: relative; flex: none;
  }
  .switch i {
    position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%;
    background: white; box-shadow: 0 1px 3px rgba(0,0,0,.28); transition: left .15s ease;
  }
  .switch.on { background: #34c759; }
  .switch.on i { left: 14px; }
  .switch:disabled { opacity: .4; cursor: default; }
  .check {
    width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid rgba(120,120,128,.55);
    background: transparent; display: grid; place-items: center; color: white; padding: 0; flex: none;
  }
  .check.on { background: var(--blue); border-color: var(--blue); }
  .check:disabled { opacity: .35; }
  select {
    height: 24px; border-radius: 6px; border: 0.5px solid var(--line);
    background: var(--card); padding: 0 6px; font-size: 12px;
  }
  input[type="range"] { width: 140px; accent-color: var(--blue); }
  .add {
    width: 100%; border: 0; background: transparent; color: var(--blue);
    text-align: left; padding: 10px 14px; font-weight: 560;
  }
  .iconbtn {
    width: 26px; height: 22px; border: 0; border-radius: 6px; background: transparent;
    display: grid; place-items: center; color: var(--secondary); padding: 0;
  }
  .iconbtn:hover { background: var(--fill); color: var(--text); }
  .iconbtn.on { color: var(--blue); }
  .iconbtn.spin .uico { animation: spin .7s linear 1; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #popover {
    position: fixed; z-index: 30; width: 340px; max-height: calc(100vh - 96px); overflow: auto;
    border-radius: 14px; background: var(--popover);
    backdrop-filter: blur(28px) saturate(1.5);
    -webkit-backdrop-filter: blur(28px) saturate(1.5);
    box-shadow: 0 18px 50px rgba(0,0,0,.22), 0 0 0 0.5px rgba(0,0,0,.08);
  }
  .ph { display: flex; align-items: center; gap: 8px; padding: 12px 12px 10px; border-bottom: 0.5px solid var(--line); }
  .pt { font-weight: 650; letter-spacing: -0.01em; }
  .ps { font-size: 11px; color: var(--secondary); margin-top: 1px; }
  .pactions { margin-left: auto; display: flex; align-items: center; gap: 2px; }
  .live { width: 7px; height: 7px; border-radius: 50%; background: #34c759; box-shadow: 0 0 0 3px rgba(52,199,89,.16); margin-right: 4px; }
  .block { padding: 12px 16px 14px; }
  .sep { height: 0.5px; background: var(--line); margin: 0 16px; }
  .bhead { display: flex; gap: 8px; align-items: center; }
  .bname { font-weight: 650; letter-spacing: -0.01em; }
  .bplan { font-size: 11px; color: var(--secondary); }
  .breset { margin-left: auto; font-size: 11px; color: var(--secondary); }
  .bbody { display: flex; gap: 14px; margin-top: 12px; align-items: center; }
  .bright { flex: 1; min-width: 0; }
  .wlab { display: flex; justify-content: space-between; font-size: 12px; color: var(--secondary); margin-bottom: 4px; }
  .wlab b { font-weight: 650; }
  .stats2 { display: flex; gap: 14px; margin-top: 9px; }
  .stats2 b { display: block; font-size: 12px; font-weight: 600; }
  .stats2 span { font-size: 10px; color: var(--tertiary); }
  .err { margin-top: 8px; font-size: 12px; color: var(--secondary); }
  .extra { padding: 8px 16px 10px; }
  .exh { font-size: 11px; color: var(--tertiary); font-weight: 650; display: flex; justify-content: space-between; }
  .exrow { display: flex; align-items: center; gap: 10px; padding: 7px 0; font-size: 12px; }
  .exrow span { margin-left: auto; color: var(--secondary); }
  .exrow span + span { margin-left: 0; }
  .exrow b { font-weight: 600; }
  #widget, #hud { position: absolute; right: 16px; width: 250px; user-select: none; }
  #widget { top: 16px; cursor: pointer; }
  #hud { top: 196px; cursor: grab; }
  #widget, #hud, .sheet {
    border: 0.5px solid rgba(255,255,255,.35);
  }
  #widget {
    background: var(--widget);
    backdrop-filter: blur(22px) saturate(1.4);
    border-radius: 20px; padding: 12px 12px 8px;
    box-shadow: 0 10px 28px rgba(0,0,0,.14);
  }
  #widget h4 { margin: 0 2px 8px; font-size: 12px; color: var(--secondary); font-weight: 650; }
  .wrow { display: flex; gap: 8px; align-items: center; padding: 5px 2px; }
  .wmid { flex: 1; min-width: 0; }
  .wname { font-size: 12px; font-weight: 650; display: flex; justify-content: space-between; gap: 6px; }
  .wname span, .wright small { color: var(--secondary); font-weight: 500; font-size: 10px; }
  .wbar { height: 4px; border-radius: 2px; background: var(--track); margin-top: 4px; overflow: hidden; }
  .wbar i { display: block; height: 100%; border-radius: 2px; }
  .wright { width: 52px; text-align: right; }
  .wright b { display: block; font-size: 13px; letter-spacing: -0.03em; }
  #hud {
    background: var(--hud);
    backdrop-filter: blur(22px) saturate(1.4);
    border-radius: 14px; padding: 10px 12px;
    box-shadow: 0 10px 28px rgba(0,0,0,.18);
    display: flex; flex-direction: column; gap: 7px;
  }
  .hudrow { display: flex; align-items: center; gap: 8px; }
  .hudbar { flex: 1; height: 4px; border-radius: 2px; background: var(--track); overflow: hidden; }
  .hudbar i { display: block; height: 100%; border-radius: 2px; }

function usageChart(days) {
  if (days.length < 2) return "";
  const w = 640, h = 214, l = 44, r = 8, t = 12, b = 26;
  const iw = w - l - r, ih = h - t - b;
  const vals = days.map((d) => spendValue(d, "codex") + spendValue(d, "claude"));
  const max = Math.max(...vals, 1);
  const yMax = Math.max(8, Math.ceil(max / 4) * 4);
  const slot = iw / days.length;
  const bw = Math.min(22, slot * 0.62);
  const y = (v) => t + ih - (v / yMax) * ih;
  const base = t + ih;
  const grids = [0, 0.5, 1].map((g) => {
    const yy = y(yMax * g);
    const lab = g === 0 ? "0" : "$" + (yMax * (1 - g) === yMax ? yMax : +(yMax * (1 - g)).toFixed(0));
    const value = yMax * (1 - g);
    return `<line x1="${l}" x2="${w - r}" y1="${y(value)}" y2="${y(value)}" stroke="var(--line)"></line>
      <text x="${l - 6}" y="${y(value) + 3}" text-anchor="end" font-size="10" fill="var(--tertiary)">${value === 0 ? "0" : "$" + value}</text>`;
  }).join("");
  const cols = days.map((d, i) => {
    const cx = l + slot * i + slot / 2;
    const cv = spendValue(d, "codex");
    const lv = spendValue(d, "claude");
    const x = cx - bw / 2;
    const h1 = (cv / yMax) * ih;
    const h2 = (lv / yMax) * ih;
    const tip = `${d.day.slice(5)} · Codex ${fmtCost(cv)} · Claude ${fmtCost(lv)}${d.real ? "" : " · 示例"}`;
    const y2 = base - h1 - h2;
    const y1 = base - h1;
    return `<g data-tip="${tip}">
      <rect x="${cx - slot / 2}" y="${t}" width="${slot}" height="${ih}" fill="transparent"></rect>
      ${h1 ? `<rect x="${x}" y="${y1}" width="${bw}" height="${h1}" rx="${h2 ? 0 : 4}" fill="var(--codex)"></rect>` : ""}
      ${h2 ? `<rect x="${x}" y="${y2}" width="${bw}" height="${Math.max(h2 - (h1 ? 1.5 : 0), 0)}" rx="4" fill="var(--claude)"></rect>` : ""}
      <text x="${cx}" y="${h - 8}" text-anchor="middle" font-size="10" fill="var(--tertiary)">${d.day.slice(5).replace("-", "/")}</text>
    </g>`;
  }).join("");
  return `<svg class="chart" viewBox="0 0 ${w} ${h}">${grids}${cols}</svg>`;
}
function lineChart(events, color) {
  const w = 640, h = 200, l = 36, r = 12, t = 14, b = 24;
  const iw = w - l - r, ih = h - t - b;
  const minT = 10 * 60, maxT = 16 * 60 + 30;
  const xOf = (hm) => { const [hh, mm] = hm.split(":").map(Number); return l + ((hh * 60 + mm - minT) / (maxT - minT)) * iw; };
  const yOf = (p) => t + ((100 - p) / 100) * ih;
  const pts = events.map((e) => ({ ...e, x: xOf(e.t), y: yOf(e.after) }));
  const line = pts.map((p) => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
  const area = `${pts[0].x.toFixed(1)},${(t + ih).toFixed(1)} ${line} ${pts[pts.length - 1].x.toFixed(1)},${(t + ih).toFixed(1)}`;
  const grids = [0, 20, 50, 80, 100].map((v) => `<line x1="${l}" x2="${w - r}" y1="${yOf(v)}" y2="${yOf(v)}" stroke="var(--line)"></line><text x="${l - 6}" y="${yOf(v) + 3}" text-anchor="end" font-size="10" fill="var(--tertiary)">${v}</text>`).join("");
  const ticks = ["10:00", "12:00", "14:00", "16:00"].map((hm) => `<text x="${xOf(hm)}" y="${h - 6}" text-anchor="middle" font-size="10" fill="var(--tertiary)">${hm}</text>`).join("");
  const dots = pts.map((p) => `<g data-tip="${p.t} · 剩余 ${p.after}% · ${p.d > 0 ? "+" : ""}${p.d}%"><circle cx="${p.x}" cy="${p.y}" r="8" fill="transparent"></circle><circle class="dot" cx="${p.x}" cy="${p.y}" r="3.2" fill="${color}" stroke="var(--card)" stroke-width="1.5"></circle></g>`).join("");
  return `<svg class="chart" viewBox="0 0 ${w} ${h}">${grids}<polygon points="${area}" fill="${color}" opacity="0.12"></polygon><polyline points="${line}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"></polyline>${dots}${ticks}</svg>`;
}

    floating: `<div class="group"><h3>桌面悬浮窗</h3><p class="desc">贴在桌面上的小窗。全局快捷键 ⌃⌥F，右键可以关掉。</p>
      <div class="gbody">
        <div class="grow"><div class="gl"><div class="gt">显示悬浮窗</div></div>${switchHTML(state.hudOn, "toggle-hud", "", true)}</div>
        <div class="grow"><div class="gl"><div class="gt">显示 Codex</div></div>${checkHTML(state.hudRows.codex, "toggle-hudrow", "codex", !state.show.codex)}</div>
        <div class="grow"><div class="gl"><div class="gt">显示 Claude Code</div></div>${checkHTML(state.hudRows.claude, "toggle-hudrow", "claude", !state.show.claude)}</div>
        <div class="grow"><div class="gl"><div class="gt">显示 Cursor</div><div class="gd">账号打开后才有效。</div></div>${checkHTML(state.hudRows.cursor, "toggle-hudrow", "cursor", !state.show.cursor)}</div>
        <div class="grow"><div class="gl"><div class="gt">不透明度</div></div><input type="range" min="0.45" max="1" step="0.05" value="${state.opacity}" data-change="opacity"><span id="op-lab" class="num">${Math.round(state.opacity * 100)}%</span></div>
      </div></div>`,
    refresh: `<div class="group"><h3>刷新</h3><p class="desc">后台轮询。样式稿不会真的发请求。</p>
      <div class="gbody">
        <div class="grow"><div class="gl"><div class="gt">额度刷新</div></div>
          <select data-change="quotaEvery">${["1", "2", "3", "5", "10"].map((n) => `<option ${state.quotaEvery === n ? "selected" : ""}>${n}</option>`).join("")}</select><span>分钟</span></div>
        <div class="grow"><div class="gl"><div class="gt">日志扫描</div></div>
          <select data-change="usageEvery">${["1", "2", "3", "5", "10"].map((n) => `<option ${state.usageEvery === n ? "selected" : ""}>${n}</option>`).join("")}</select><span>分钟</span></div>
        <div class="grow"><div class="gl"><div class="gt">重置时间</div><div class="gd">悬停在时间上会临时换成另一种写法。</div></div>
          <div class="seg">${[["remain", "剩余"], ["exact", "时刻"]].map(([id, name]) => `<button class="${state.resetFormat === id ? "on" : ""}" data-act="reset-format" data-id="${id}" data-keep="1">${name}</button>`).join("")}</div>
        </div>
        <div class="grow"><div class="gl"><div class="gt">服务状态圆点</div><div class="gd">弹出窗口里 OpenAI / Anthropic 的状态。</div></div>${switchHTML(state.statusDot, "toggle-bool", "statusDot", true)}</div>
        <div class="grow"><div class="gl"><div class="gt">上次刷新</div></div><span class="num" style="color:var(--secondary)">${state.refreshed}</span></div>
      </div></div>`,
    general: `<div class="group"><h3>通用</h3><div class="gbody">
        <div class="grow"><div class="gl"><div class="gt">隐私模式</div><div class="gd">弹出窗口里不显示主账号邮箱。</div></div>${switchHTML(state.privacy, "toggle-bool", "privacy", true)}</div>
        <div class="grow"><div class="gl"><div class="gt">开机自动启动</div></div>${switchHTML(state.launch, "toggle-bool", "launch", true)}</div>
        <div class="grow"><div class="gl"><div class="gt">外观</div></div>
          <div class="seg">${[["system", "跟随系统"], ["light", "浅色"], ["dark", "深色"]].map(([id, name]) => `<button class="${state.themeMode === id ? "on" : ""}" data-act="theme" data-id="${id}" data-keep="1">${name}</button>`).join("")}</div>
        </div>
        <div class="grow"><div class="gl"><div class="gt">语言</div></div>
          <select data-change="lang"><option value="zh" selected>跟随系统 · 中文</option><option value="en">English</option></select></div>
        <div class="grow"><div class="gl"><div class="gt">版本</div></div><span class="num" style="color:var(--secondary)">样式稿</span></div>
      </div></div>`
  };
  return `<div class="form">${pages[state.settings] || pages.accounts}</div>${state.sheet ? sheetHTML() : ""}`;
}
function sheetHTML() {
  return `<div class="sheet-dim" data-act="close-sheet"><div class="sheet" data-act="noop">
    <h3>添加 Codex 账号</h3>
    <p>粘贴 auth.json。样式稿不解析内容，保存后只放一个示例账号，方便看弹出窗口里的「其他账号」。</p>
    <textarea id="json" placeholder='{ "tokens": { } }'></textarea>
    <div class="sheet-actions"><button class="btn ghost" data-act="close-sheet">取消</button><button class="btn primary" data-act="save-sheet">添加</button></div>
  </div></div>`;
}
function contentHTML() {
  if (state.tab === "settings") return settingsHTML();
  if (state.view === "timeline") return timelineHTML();
  if (state.view === "detail") return detailHTML();
  return overviewHTML();
}
function widgetHTML() {
  const ids = enabled().filter((id) => state.hudRows[id] || true).filter((id) => state.show[id]);
  const rows = ids.map((id) => {
    if (id === "cursor") {
      const q = live("cursor");
      const p = q && state.cursorMode !== "unsupported" ? q.cycle : null;
      return widgetRow(id, "账期", p, p == null ? "—" : (state.cursorMode === "sample" ? "12 天" : "等待"));
    }
    const q = live(id);
    const p = state.period === "week" ? q.week : q.h5;
    const reset = state.period === "week" ? q.wr : q.h5r;
    return widgetRow(id, state.period === "week" ? "周" : "5 小时", p, reset);
  }).join("");
  const body = ids.length ? rows : `<div class="empty" style="min-height:88px"><b>未启用</b></div>`;
  return `<button id="widget" data-act="widget">${`<h4>额度</h4>`}${body}</button>`;
}
function widgetRow(id, win, p, reset) {
  const color = p == null ? "var(--track)" : (p > 50 ? brand(id) : statusColor(p));
  return `<div class="wrow"><div class="tile sm ${id}">${logo(id)}</div><div class="wmid"><div class="wname">${NAME[id].replace(" Code", "")}<span>${win}</span></div><div class="wbar"><i style="width:${p || 0}%;background:${color}"></i></div></div><div class="wright"><b class="num">${p == null ? "—" : p + "%"}</b><small class="num">${reset}</small></div></div>`;
}
function hudHTML() {
  if (!state.hudOn) return "";
  const ids = enabled().filter((id) => state.hudRows[id]);
  if (!ids.length) return "";
  const rows = ids.map((id) => {
    let p = null;
    if (id === "cursor") {
      const q = live("cursor");
      p = q && state.cursorMode !== "unsupported" ? q.cycle : null;
    } else {
      const q = live(id);
      p = state.period === "week" ? q.week : q.h5;
    }
    const color = p == null ? "var(--track)" : statusColor(p);
    const text = p == null ? "—" : (enabled().length >= 3 ? String(p) : p + "%");
    return `<div class="hudrow"><div class="tile sm ${id}">${logo(id)}</div><div class="hudbar"><i style="width:${p || 0}%;background:${color}"></i></div><div class="hudp num">${text}</div></div>`;
  }).join("");
  return `<div id="hud">${rows}</div>`;
}
function windowHTML() {
  return `<div class="window">
    <div class="titlebar">
      <div class="lights"><div class="light r"><span>×</span></div><div class="light y"><span>−</span></div><div class="light g"><span>+</span></div></div>
      <div class="title-seg">
        <button class="${state.tab === "stats" ? "on" : ""}" data-act="tab" data-id="stats">用量统计</button>
        <button class="${state.tab === "settings" ? "on" : ""}" data-act="tab" data-id="settings">设置</button>
      </div>
    </div>
    <div class="body">
      <aside class="sidebar">${sidebarHTML()}</aside>
      <div class="main">${toolbarHTML()}<div class="content">${contentHTML()}</div></div>
    </div>
  </div>${widgetHTML()}${hudHTML()}`;
}
function popoverBlock(id) {
  if (id === "cursor") {
    const q = live("cursor");
    const bad = state.cursorMode === "unsupported";
    const pct = q && !bad ? q.cycle : null;
    const plan = bad ? "暂不支持" : state.cursorMode === "wait" ? "已登录" : "Pro · 示例";
    const od = q && q.od != null ? `<div class="wlab" style="margin-top:8px"><span>OD · 按量</span><b class="num" style="color:${statusColor(q.od)}">${q.od}%</b></div>${bar(q.od, statusColor(q.od))}` : "";
    return `<div class="block"><div class="bhead"><div class="tile cursor">${logo("cursor")}</div><div><div class="bname">Cursor</div><div class="bplan">${plan}</div></div><div class="breset">${q ? resetHTML(q.cr, q.ce) : "等待数据"}</div></div>
      <div class="bbody">${ring("cursor", pct, 54, "status")}<div class="bright"><div class="wlab"><span>CYCLE · 账期</span><b class="num" style="color:${pct == null ? "inherit" : statusColor(pct)}">${pct == null ? "—" : pct + "%"}</b></div>${pct == null ? "" : bar(pct, statusColor(pct))}${od}</div></div>
      ${bad ? `<div class="err">没有个人包含额度，暂不支持。</div>` : state.cursorMode === "wait" ? `<div class="err">额度尚未返回。花费不在这里显示。</div>` : ""}</div>`;
  }
  const q = live(id);
  const row = TODAY_ROWS.find((r) => r.service === id);
  const dot = state.statusDot ? `<i class="live" title="正常" style="margin-left:auto;box-shadow:none"></i>` : `<span style="margin-left:auto"></span>`;
  return `<div class="block"><div class="bhead"><div class="tile ${id}">${logo(id)}</div><div><div class="bname">${NAME[id]}</div><div class="bplan">${state.privacy ? PLAN[id] : PLAN[id] + " · 本机账号"}</div></div>${dot}<div class="breset">${resetHTML(q.h5r, q.h5e)}</div></div>
    <div class="bbody">${ring(id, q.h5, 54, "status")}<div class="bright">
      <div class="wlab"><span>周额度</span><b class="num" style="color:${statusColor(q.week)}">${q.week}%</b></div>
      ${bar(q.week, statusColor(q.week))}
      <div class="stats2"><div><b class="num">${fmtToken(row.total)}</b><span>今日 tokens</span></div><div><b class="num">${fmtCost(row.cost)}</b><span>今日花费</span></div></div>
    </div></div></div>`;
}
function popoverHTML() {
  const ids = enabled();
  let body;
  if (!ids.length) body = `<div class="empty"><b>未启用任何服务</b><p>到「设置 → 账号」开启。</p></div>`;
  else {
    const chunks = [];
    ids.forEach((id, i) => {
      if (i) chunks.push(`<div class="sep"></div>`);
      chunks.push(popoverBlock(id));
      if (id === "codex" && state.extras.length) {
        chunks.push(`<div class="sep"></div><div class="extra"><div class="exh">其他账号<span>${state.extras.length}</span></div>${state.extras.map((ex) => `<div class="exrow"><b>${ex.name}</b><span class="num">5 小时 ${ex.h5}%</span><span class="num">周 ${ex.week}%</span></div>`).join("")}</div>`);
      }
    });
    body = chunks.join("");
  }
  return `<div class="ph"><div><div class="pt">用量</div><div class="ps">${state.refreshed}</div></div><div class="pactions">
      <i class="live" title="在线"></i>
      <button class="iconbtn" data-act="open-stats" title="查看统计">${uiIcon("chart")}</button>
      <button class="iconbtn ${state.refreshing ? "spin" : ""}" data-act="refresh" title="立即刷新">${uiIcon("refresh")}</button>
      <button class="iconbtn ${state.hudOn ? "on" : ""}" data-act="toggle-hud" data-keep="1" title="${state.hudOn ? "隐藏悬浮窗 (⌃⌥F)" : "显示悬浮窗 (⌃⌥F)"}">${uiIcon("hud")}</button>
      <button class="iconbtn" data-act="open-settings" title="设置">${uiIcon("gear")}</button>
      <button class="iconbtn" data-act="quit" title="退出">${uiIcon("power")}</button>
    </div></div>${body}`;
}
function reviewHTML() {
  const mode = state.show.cursor ? state.cursorMode : "off";
  const cur = [["off", "关闭"], ["wait", "等待数据"], ["sample", "示例 74%"], ["unsupported", "暂不支持"]];
  const themes = [["light", "浅色"], ["dark", "深色"], ["system", "跟随系统"]];
  return `<b>样式稿</b><span class="rlab">Cursor 数据</span><div class="rseg">${cur.map(([id, name]) => `<button class="${mode === id ? "on" : ""}" data-act="cursor-preview" data-id="${id}">${name}</button>`).join("")}</div>
    <span class="rlab">外观</span><div class="rseg">${themes.map(([id, name]) => `<button class="${state.themeMode === id ? "on" : ""}" data-act="theme" data-id="${id}">${name}</button>`).join("")}</div>
    <span class="rhint">点菜单栏右侧额度。悬浮窗可拖，右键可关。今天的数字按你的统计对齐；更早的日期是示例。</span>`;
}
function placePopover() {
  const pop = document.getElementById("popover");
  const item = document.getElementById("status-item");
  if (!pop || !item || pop.hidden) return;
  const r = item.getBoundingClientRect();
  const width = 340;
  let left = r.right - width;
  left = Math.max(12, Math.min(left, window.innerWidth - width - 12));
  pop.style.left = left + "px";
  pop.style.top = (r.bottom + 8) + "px";
}
function placeHud() {
  const hud = document.getElementById("hud");
  if (!hud || state.hudLeft == null) return;
  hud.style.left = state.hudLeft + "px";
  hud.style.top = state.hudTop + "px";
  hud.style.right = "auto";
  hud.style.opacity = state.opacity;
}
function render() {
  const prev = document.querySelector(".content");
  const top = keepScroll && prev ? prev.scrollTop : 0;
  keepScroll = false;
  document.getElementById("menubar").innerHTML = menuHTML();
  document.getElementById("stage").innerHTML = windowHTML();
  const pop = document.getElementById("popover");
  pop.hidden = !state.popover;
  pop.innerHTML = popoverHTML();
  document.getElementById("review").innerHTML = reviewHTML();
  const hudMenu = document.getElementById("hudmenu");
  if (state.hudMenu) {
    let el = hudMenu;
    if (!el) {
      el = document.createElement("div");
      el.id = "hudmenu";
      document.body.appendChild(el);
    }
    el.hidden = false;
    el.style.left = state.hudMenu.x + "px";
    el.style.top = state.hudMenu.y + "px";
    el.innerHTML = `<button data-act="hud-close">关闭悬浮窗</button><button data-act="hud-settings">设置…</button>`;
  } else if (hudMenu) hudMenu.hidden = true;
  const next = document.querySelector(".content");
  if (next) next.scrollTop = top;
  const hud = document.getElementById("hud");
  if (hud) hud.style.opacity = state.opacity;
  placeHud();
  placePopover();
}
function rerender(opts) {
  keepScroll = !!(opts && opts.keepScroll);
  render();
}
function toast(msg) {
  const el = document.getElementById("toast");
  el.hidden = false;
  el.textContent = msg;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { el.hidden = true; }, 2200);
}
function doRefresh() {
  if (state.refreshing) return;
  state.refreshing = true;
  rerender({ keepScroll: true });
  setTimeout(() => {
    state.refreshing = false;
    state.refreshed = "刚刚已刷新";
    rerender({ keepScroll: true });
    toast("已刷新。样式稿不会请求接口");
  }, 700);
}
function toggleService(id) {
  state.show[id] = !state.show[id];
  if (!state.show[id] && state.service === id) state.service = "all";
}
function setCursorPreview(id) {
  if (id === "off") state.show.cursor = false;
  else { state.show.cursor = true; state.cursorMode = id; }
  if (!state.show.cursor && state.service === "cursor") state.service = "all";
}
function handle(el) {
  const act = el.dataset.act;
  const id = el.dataset.id;
  let scroll = el.dataset.keep === "1";
  switch (act) {
    case "noop": return;
    case "toggle-popover": state.popover = !state.popover; state.rangeOpen = false; break;
    case "open-stats": state.tab = "stats"; state.view = "overview"; state.popover = false; break;
    case "open-settings": state.tab = "settings"; state.popover = false; break;
    case "refresh": doRefresh(); return;
    case "quit": toast("样式稿不会退出 ManaBar"); return;
    case "tab": state.tab = id; state.popover = false; break;
    case "view": state.view = id; state.rangeOpen = false; break;
    case "service":
      state.service = state.service === id && id !== "all" ? "all" : id;
      state.tab = "stats";
      break;
    case "settings-nav": state.settings = id; scroll = true; break;
    case "toggle-range": state.rangeOpen = !state.rangeOpen; scroll = true; break;
    case "range": state.range = id; state.rangeOpen = false; break;
    case "toggle-show": toggleService(id); scroll = true; break;
    case "toggle-hud": state.hudOn = !state.hudOn; scroll = true; break;
    case "toggle-hudrow": state.hudRows[id] = !state.hudRows[id]; scroll = true; break;
    case "toggle-bool": state[id] = !state[id]; scroll = true; break;
    case "period": state.period = id; scroll = true; break;
    case "reset-format": state.resetFormat = id; scroll = true; break;
    case "theme": state.themeMode = id; applyTheme(); scroll = true; break;
    case "cursor-preview": setCursorPreview(id); break;
    case "export": toast("正式版会保存 manabar-usage-2026-10-26.csv"); return;
    case "sort":
      if (state.sortKey === id) state.sortDir *= -1;
      else { state.sortKey = id; state.sortDir = id === "day" || id === "model" || id === "service" ? 1 : -1; }
      scroll = true;
      break;
    case "more": state.timelineMore[id] = !state.timelineMore[id]; scroll = true; break;
    case "open-sheet": state.sheet = true; scroll = true; break;
    case "close-sheet": state.sheet = false; scroll = true; break;
    case "save-sheet": {
      const v = document.querySelector("#json")?.value.trim();
      if (!v) { toast("先粘贴一段 auth.json"); return; }
      const n = state.extras.length + 1;
      state.extras.push({ name: n === 1 ? "codex-work" : "codex-" + n, h5: 74, week: 48 });
      state.sheet = false;
      toast("已放入示例账号");
      break;
    }
    case "remove-extra": state.extras.splice(Number(id), 1); scroll = true; break;
    case "widget": state.tab = "stats"; state.view = "overview"; break;
    case "hud-close": state.hudOn = false; state.hudMenu = null; break;
    case "hud-settings": state.tab = "settings"; state.settings = "floating"; state.hudMenu = null; break;
    default: return;
  }
  rerender({ keepScroll: scroll });
}

document.addEventListener("click", (e) => {
  if (e.target.closest("#hudmenu")) {
    const actEl = e.target.closest("[data-act]");
    if (actEl) handle(actEl);
    return;
  }
  const actEl = e.target.closest("[data-act]");
  let dirty = false;
  if (state.popover && !e.target.closest("#popover") && !e.target.closest("#status-item")) { state.popover = false; dirty = true; }
  if (state.rangeOpen && !e.target.closest(".rangewrap")) { state.rangeOpen = false; dirty = true; }
  if (state.hudMenu && !e.target.closest("#hudmenu")) { state.hudMenu = null; dirty = true; }
  if (actEl) { handle(actEl); return; }
  if (dirty) rerender({ keepScroll: true });
});
document.addEventListener("change", (e) => {
  const key = e.target.dataset.change;
  if (!key) return;
  if (key === "from" || key === "to") state[key] = e.target.value;
  else if (key === "quotaEvery" || key === "usageEvery") { state[key] = e.target.value; toast("已记下间隔"); }
  else if (key === "lang") { if (e.target.value !== "zh") toast("样式稿只做了中文"); }
  else return;
  rerender({ keepScroll: true });
});
document.addEventListener("input", (e) => {
  if (e.target.dataset.change !== "opacity") return;
  state.opacity = Number(e.target.value);
  const hud = document.getElementById("hud");
  if (hud) hud.style.opacity = state.opacity;
  const lab = document.getElementById("op-lab");
  if (lab) lab.textContent = Math.round(state.opacity * 100) + "%";
});
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  state.popover = false; state.rangeOpen = false; state.sheet = false; state.hudMenu = null;
  rerender({ keepScroll: true });
});
document.addEventListener("mouseover", (e) => {
  const el = e.target.closest(".swap");
  if (!el || el.dataset.hot) return;
  el.dataset.hot = "1";
  el.dataset.base = el.textContent;
  el.textContent = el.dataset.alt;
});
document.addEventListener("mouseout", (e) => {
  const el = e.target.closest(".swap");
  if (!el || el.contains(e.relatedTarget)) return;
  if (el.dataset.base) el.textContent = el.dataset.base;
  delete el.dataset.hot;
});
document.addEventListener("mousemove", (e) => {
  const tip = document.getElementById("tip");
  const host = e.target.closest("[data-tip]") || e.target.closest("svg.chart");
  const direct = e.target.closest("[data-tip]");
  if (!direct) { tip.hidden = true; return; }
  tip.hidden = false;
  tip.textContent = direct.dataset.tip;
  tip.style.left = Math.min(e.clientX + 14, window.innerWidth - 220) + "px";
  tip.style.top = (e.clientY + 16) + "px";
});
document.addEventListener("contextmenu", (e) => {
  const hud = e.target.closest("#hud");
  if (!hud) return;
  e.preventDefault();
  state.hudMenu = { x: e.clientX, y: e.clientY };
  render();
});
let drag = null;
document.addEventListener("pointerdown", (e) => {
  const hud = e.target.closest("#hud");
  if (!hud) return;
  const box = hud.getBoundingClientRect();
  const stage = document.getElementById("stage").getBoundingClientRect();
  drag = { dx: e.clientX - box.left, dy: e.clientY - box.top, stage };
  hud.setPointerCapture(e.pointerId);
});
document.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const hud = document.getElementById("hud");
  if (!hud) return;
  const left = e.clientX - drag.dx - drag.stage.left;
  const top = e.clientY - drag.dy - drag.stage.top;
  hud.style.left = left + "px";
  hud.style.top = top + "px";
  hud.style.right = "auto";
  state.hudLeft = left;
  state.hudTop = top;
});
document.addEventListener("pointerup", () => { drag = null; });
window.addEventListener("resize", placePopover);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
  if (state.themeMode === "system") { applyTheme(); render(); }
});
applyTheme();
render();
</script>
</body>
</html>
